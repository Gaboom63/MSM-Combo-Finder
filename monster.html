<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="icon" type="image/x-icon" href="images/important/mammoticon.png">
    <title>MSM Combo Finder</title>
</head>

<body>
    <div id="blurOverlay"></div>
    <div id="blurMessage" onclick="reset()">Press ESC to go back</div>
    
    <div id="iconContainer">
        <img id="icon" src="images/important/Speedy_deletion.png" alt="Icon">
        <div id="textContainer">
            <div id="hoverText">This Tool Is Updated Frequently!<br> Thank you for using it :)<br>Powered By My <a href="https://github.com/Gaboom63/MSM-API" target="_blank">MSM API!</a></div>
        </div>
    </div>
    
    <h1 id="title">My Singing Monsters <br> Combo Finder</h1>
    <div id="particles-container"></div>

    <div id="inputContainer">
        <button id="openBreedUI" class="theme-btn">Breed Two Monsters</button>
        <button id="randomComboBtn" class="theme-btn surprise-variant"><i class="fas fa-dice"></i> Surprise Me!</button>

        <div class="divider"><span>OR</span></div>

        <input id="Search_Monster" class="theme-search" autocomplete="off" placeholder="🔍 Search any monster...">

        <div id="recent-discoveries" class="recent-container">
            <h3>- Recent Discoveries -</h3>
            <div id="recent-grid" class="recent-grid"></div>
        </div>
    </div>

    <div class="island-container" id="island-container">
        <button id="openBreedUI_DOF" class="theme-btn" style="background: rgba(125, 125, 181, 0.7); color: white; border: solid white 1px;">Breed Two Monsters</button>
        <button id="randomComboBtn_DOF" class="theme-btn surprise-variant" style="background: rgba(125, 125, 181, 0.7); color: white; border: solid white 1px;"><i class="fas fa-dice"></i> Surprise Me!</button>
        <div class="divider"><span>OR</span></div>

        <input id="Search_Monster_DOF" class="theme-search" autocomplete="off" placeholder="🔍 Search any monster..." style="background: rgba(125, 125, 181, 0.7); color: white; border: solid white 1px;">

        <div id="recent-discoveries-DOF" class="recent-container" style="background: rgba(125, 125, 181, 0.7); color: white; border: solid white 1px;">
            <h3>- Recent Discoveries -</h3>
            <div id="recent-grid-DOF" class="recent-grid"></div>
        </div>
    </div>

    <div id="breedSplitView">
        <button id="closeBreedUI" class="menu-close-btn" title="Close" onclick="reset()"><i class="fas fa-times"></i></button>

        <div class="split-half">
            <h2>Parent 1</h2>
            <div id="placeholder-1" class="empty-slot"><i class="fas fa-egg"></i></div>
            <img id="parent-img-1" class="parent-img" style="display: none;">
            <input id="First_Monster" autocomplete="off" placeholder="Choose First Monster...">
            <div id="grid1" class="local-grid"></div>
        </div>

        <div class="split-divider"><div class="fusion-badge"><i class="fas fa-plus"></i></div></div>

        <div class="split-half">
            <h2>Parent 2</h2>
            <div id="placeholder-2" class="empty-slot"><i class="fas fa-egg"></i></div>
            <img id="parent-img-2" class="parent-img" style="display: none;">
            <input id="Second_Monster" autocomplete="off" placeholder="Choose Second Monster...">
            <div id="grid2" class="local-grid"></div>
        </div>
    </div>

    <div id="dynamicMonsterGrid"></div>

    <div id="resultContainer">
        <div id="leftPanel">
            <div id="tabsContainer" class="tabs-container"></div>
            <div id="utilityButtons">
                <button id="costumeButton">Switch Costume</button>
                <button id="majorMinorButton">Switch</button>
                <button id="prismaticButton" style="display:none;">Cycle Prismatic</button>
                <button id="common">Common</button>
                <button id="rare">Rare</button>
                <button id="epic">Epic</button>
                <button id="dofAgeToggle" style="display:none;">
                        Switch To Adult
                </button>
                <button id="volume-button" title="Play Sound" onclick="playSound()"><i class="fas fa-volume-up"></i></button>
            </div>
            <div id="imageContainer">
                <div id="loadingSpinner" class="spinner"></div>
                <img id="monsterImage" class="monster-image">
            </div>
        </div>
        <div id="statsBox"></div>
    </div>

    <div id="sideMenu">
        <button id="sideMenuButton" onclick="setupSideMenu()">
            <i id="menuArrow" class="fas fa-arrow-left"></i>
        </button>
        
        <div id="mainStatBox">
            <div class="purple-sketch-bg-main"></div>
            
            <div id="statsSection">
                <div class="tracker-controls">
                    <input type="text" id="tracker-mini-search" class="menu-mini-search" placeholder="🔍 Filter rows..." autocomplete="off">
                    <button id="previous-island" class="nav-btn"><i class="fas fa-chevron-left"></i> Left</button>
                    <button id="next-island" class="nav-btn">Right <i class="fas fa-chevron-right"></i></button>
                    <button id="closeStatMenu" class="menu-close-btn" title="Close" onclick="hideStatBox()"><i class="fas fa-times"></i></button>
                </div>
                <div id="stats" class="custom-scroll-container"></div>
            </div>
            
            <div id="inventorySection"></div>
            <div id="costSection"></div>
        </div>
    </div>

    <img id="noMonsterImage">

    <script src="JS/monster.js"></script>
    <script src="JS/side_menu.js"></script>
</body>
</html>
